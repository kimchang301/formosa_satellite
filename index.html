<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>福衛軌道桌布</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600&family=Noto+Sans+TC:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed night-sky canvas, globe centered on Taiwan, quiet HUD in the corners that fades when idle */
:root{
  --space:#04060c; --ink:#dfe7f2; --muted:#7e8ca3; --line:rgba(150,175,210,.16);
  --panel:rgba(8,12,22,.62); --taiwan:#5fe0b4;
  --fs5:#f2b45a; --fs7:#62c6ea; --triton:#b49cff; --fs8:#ff8f7a;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--space);color:var(--ink);font-family:var(--body)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
canvas:active{cursor:grabbing}
.hud{position:fixed;transition:opacity .8s ease;pointer-events:none}
.hud *{pointer-events:auto}
body.idle .fade{opacity:0}
body.wall .controls{display:none}
.title{top:max(28px,env(safe-area-inset-top,0px));left:max(32px,env(safe-area-inset-left,0px))}
.title h1{font-family:var(--display);font-weight:600;font-size:clamp(22px,2.4vw,34px);letter-spacing:.18em;margin:0;text-wrap:balance}
.title .en{font-family:var(--mono);font-size:11px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-top:6px}
.clock{margin-top:18px;display:grid;grid-template-columns:auto auto;gap:4px 14px;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.clock dt{color:var(--muted);font-family:var(--body);font-size:11px;letter-spacing:.08em}
.clock dd{margin:0}
.clock .big{font-size:22px;letter-spacing:.04em}
.sats{right:max(28px,env(safe-area-inset-right,0px));top:max(28px,env(safe-area-inset-top,0px));width:300px;background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.sats h2{margin:0 0 10px;font-size:11px;font-weight:500;letter-spacing:.2em;color:var(--muted)}
.row{display:grid;grid-template-columns:10px 1fr auto;gap:2px 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.chip{width:8px;height:8px;border-radius:50%;align-self:center}
.name{font-size:13px;font-weight:500}
.name small{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:6px;font-weight:400}
.pass{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pass.on{color:var(--taiwan)}
.meta{grid-column:2/4;font-family:var(--mono);font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.note{margin:10px 0 0;font-size:10.5px;line-height:1.55;color:var(--muted)}
.controls{left:50%;transform:translateX(-50%);bottom:max(22px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--panel);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:6px;max-width:calc(100vw - 32px)}
button{font:500 12px var(--body);color:var(--ink);background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-variant-numeric:tabular-nums}
button:hover{border-color:var(--line)}
button[aria-pressed="true"]{background:rgba(95,224,180,.14);border-color:rgba(95,224,180,.45);color:var(--taiwan)}
button:focus-visible{outline:2px solid var(--taiwan);outline-offset:2px}
.sep{width:1px;background:var(--line);margin:4px 2px}
@media (max-width:760px){
  .sats{top:auto;bottom:calc(max(22px,env(safe-area-inset-bottom,0px)) + 92px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:34vh;overflow:auto;padding:10px 12px}
  .title{left:max(16px,env(safe-area-inset-left,0px));top:max(16px,env(safe-area-inset-top,0px))}
  .clock .big{font-size:18px}
  .note{display:none}
}
@media (prefers-reduced-motion:reduce){.hud{transition:none}}
</style>

</aside>

const jd=t=>t/86400000+2440587.5;
function gmst(t){const d=jd(t)-2451545;return ((280.46061837+360.98564736629*d)%360+360)%360}
function sun(t){const n=jd(t)-2451545,L=(280.46+0.9856474*n)*D2R,g=(357.528+0.9856003*n)*D2R;

  return {ra:Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam))*R2D,dec:Math.asin(Math.sin(eps)*Math.sin(lam))*R2D}}
function meanSunRA(t){const n=jd(t)-2451545;return (280.46+0.9856474*n)%360}
const ll2v=(lat,lon)=>{const a=lat*D2R,b=lon*D2R,c=Math.cos(a);return [c*Math.cos(b),c*Math.sin(b),Math.sin(a)]};

function satECEF(s,t,du=0){

  const g=-gmst(t)*D2R,cg=Math.cos(g),sg=Math.sin(g);

  return [r*(cg*x-sg*y),r*(sg*x+cg*y),r*z];
}

list.innerHTML=SATS.map((s,k)=>`<div class="row"><span class="chip" style="background:${s.color}"></span><span class="name">${s.name}<small>${s.alt} km · ${s.inc.toFixed(1)}°</small></span><span class="pass" id="p${k}">—</span><span class="meta" id="m${k}"></span></div>`).join('');

function fmtT(t){return new Date(t).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})}
function fmtDur(ms){const m=Math.round(ms/60000);return m<60?m+' 分後':Math.floor(m/60)+' 時 '+(m%60)+' 分後'}

/* ---------- render ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(ts-last<33)return; const dtf=(ts-last)/1000; last=ts;
  if(drift)view.lon=((view.lon+dtf*3+540)%360)-180;
  basis();
  const t=simNow();
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(stars,0,0,W,H);

  // sun in ECEF
  const S=sun(t),sl=S.ra-gmst(t),sv=ll2v(S.dec,sl),sp=[dot(sv,E),dot(sv,N),dot(sv,C)];

  // atmosphere
  let g=ctx.createRadialGradient(cx,cy,R*.96,cx,cy,R*1.22);
  g.addColorStop(0,'rgba(90,150,230,.28)');g.addColorStop(.35,'rgba(70,120,210,.08)');g.addColorStop(1,'rgba(40,80,160,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R*1.22,0,7);ctx.fill();
  // globe body with sunlit side
  g=ctx.createRadialGradient(cx+sp[0]*R*.9,cy-sp[1]*R*.9,R*.05,cx,cy,R*1.5);
  const day=Math.max(0,sp[2]*.5+.5);
  g.addColorStop(0,`rgba(28,52,92,${.55+day*.4})`);g.addColorStop(.55,'#0b1426');g.addColorStop(1,'#050913');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();

  // graticule
  ctx.strokeStyle='rgba(140,170,215,.07)';ctx.lineWidth=1;ctx.beginPath();
  for(const l of GRAT){let pen=false;for(const v of l){const q=proj(v);if(q[2]>0){pen?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);pen=true}else pen=false}}
  ctx.stroke();

  // land dots bucketed by illumination
  const B=6,paths=[];for(let k=0;k<B;k++)paths.push(new Path2D());
  const ds=Math.max(1.2,R/260);
  for(const v of LANDV){const z=dot(v,C);if(z<=0.02)continue;
    const il=dot(v,sv);let b=il>0.12?5:il>0.02?4:il>-0.06?3:il>-0.14?2:il>-0.3?1:0;
    const x=cx+dot(v,E)*R,y=cy-dot(v,N)*R,s=ds*(0.55+0.45*z);paths[b].rect(x-s/2,y-s/2,s,s)}
  const LC=['rgba(60,82,125,.55)','rgba(70,92,135,.62)','rgba(110,128,160,.7)','rgba(165,170,170,.75)','rgba(185,200,215,.85)','rgba(205,220,236,.92)'];
  for(let k=0;k<B;k++){ctx.fillStyle=LC[k];ctx.fill(paths[k])}

  // Taiwan
  ctx.beginPath();let pen=false;
  for(const v of TWV){const q=proj(v);if(q[2]>0){pen?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]);pen=true}}
  ctx.strokeStyle=col('--taiwan');ctx.lineWidth=1.4;ctx.stroke();
  const tq=proj(twV);
  if(tq[2]>0){
    // 10° elevation footprint for a 600 km pass
    const ang=Math.acos(RE/(RE+600)*Math.cos(10*D2R))-10*D2R;
    ctx.beginPath();for(let k=0;k<=64;k++){const az=k/64*2*Math.PI;
      const p=[twV[0]*Math.cos(ang)+Math.sin(ang)*(Math.cos(az)*E0[0]+Math.sin(az)*N0[0]),twV[1]*Math.cos(ang)+Math.sin(ang)*(Math.cos(az)*E0[1]+Math.sin(az)*N0[1]),twV[2]*Math.cos(ang)+Math.sin(ang)*(Math.cos(az)*E0[2]+Math.sin(az)*N0[2])];
      const q=proj(p);k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])}
    ctx.setLineDash([3,5]);ctx.strokeStyle='rgba(95,224,180,.35)';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);
    if(labels){ctx.font=`500 11px ${col('--body')}`;ctx.fillStyle=col('--taiwan');ctx.fillText('台灣',tq[0]+10,tq[1]+4)}
  }

  // satellites
  const now=[];
  for(const s of SATS){
    // orbit ring (faint) + trailing arc
    const steps=120;let prev=null,prevH=true;
    for(let k=0;k<=steps;k++){
      const du=-k*3; const p=satECEF(s,t,du),q=proj(p),hd=hidden(p,q);
      if(prev && !hd && !prevH){
        const fade=Math.max(0,1-k/90);
        ctx.strokeStyle=hexA(s.color,.08+.6*fade*fade);ctx.lineWidth=s.fam?1:1.4;
        ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();
      }
      prev=q;prevH=hd;
    }
    const p=satECEF(s,t),q=proj(p),hd=hidden(p,q);
    s.p=p;
    if(!hd){
      const r=s.fam?3:4;
      const gg=ctx.createRadialGradient(q[0],q[1],0,q[0],q[1],r*4);gg.addColorStop(0,hexA(s.color,.5));gg.addColorStop(1,hexA(s.color,0));
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(q[0],q[1],r*4,0,7);ctx.fill();
      ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(q[0],q[1],r*.4,0,7);ctx.fill();
      if(labels){ctx.font=`500 ${s.fam?10.5:12}px ${col('--body')}`;ctx.fillStyle=hexA(s.color,.95);
        ctx.fillText(s.fam?s.id.replace('FS-7 ','福七 '):s.name,q[0]+9,q[1]-7)}
    }
  }

  // HUD text
  const d=new Date(t);
  document.getElementById('tpe').textContent=fmtT(t);
  document.getElementById('date').textContent=d.toLocaleDateString('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'});
  document.getElementById('utc').textContent=d.toISOString().slice(11,16);
  if(Math.abs(t-passCache.t)>(speed===1?20000:60000*Math.max(1,speed/60))){passCache={t,data:SATS.map(s=>nextPass(s,t))}}
  SATS.forEach((s,k)=>{
    const sp_=subpoint(s.p),pc=passCache.data[k],el=document.getElementById('p'+k);
    const on=elevation(s.p)>10;
    el.className='pass'+(on?' on':'');
    el.textContent=on?'● 正在過境':(pc&&pc.t?(pc.t>t?fmtDur(pc.t-t):'即將過境'):'24 h 內無');
    document.getElementById('m'+k).textContent=`${Math.abs(sp_.lat).toFixed(1)}°${sp_.lat>=0?'N':'S'}  ${Math.abs(sp_.lon).toFixed(1)}°${sp_.lon>=0?'E':'W'}  · 週期 ${s.T.toFixed(0)} 分`;
  });
}
// local east/north at Taiwan for footprint ring
const E0=[-Math.sin(TW.lon*D2R),Math.cos(TW.lon*D2R),0];
const N0=[-Math.sin(TW.lat*D2R)*Math.cos(TW.lon*D2R),-Math.sin(TW.lat*D2R)*Math.sin(TW.lon*D2R),Math.cos(TW.lat*D2R)];
function hexA(h,a){h=h.replace('#','');const n=parseInt(h,16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a.toFixed(3)})`}

/* ---------- interaction ---------- */
let drag=null;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lat:view.lat,lon:view.lon};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const k=90/R;
  view.lon=((drag.lon-(e.clientX-drag.x)*k+540)%360)-180;view.lat=Math.max(-85,Math.min(85,drag.lat+(e.clientY-drag.y)*k))});
cv.addEventListener('pointerup',()=>drag=null);
for(const b of document.querySelectorAll('[data-s]'))b.onclick=()=>setSpeed(+b.dataset.s);
document.getElementById('now').onclick=()=>{simBase=Date.now();realBase=performance.now();passCache.t=0};
document.getElementById('home').onclick=()=>{view={lat:TW.lat-6,lon:TW.lon};setDrift(false)};
function setDrift(v){drift=v;document.getElementById('drift').setAttribute('aria-pressed',v)}
document.getElementById('drift').onclick=()=>setDrift(!drift);
document.getElementById('lbl').onclick=e=>{labels=!labels;e.currentTarget.setAttribute('aria-pressed',labels)};
document.getElementById('fs').onclick=()=>{const p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();p&&p.catch&&p.catch(()=>{})};
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.body.classList.toggle('wall')});
let idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),5000)}
addEventListener('pointermove',wake);addEventListener('keydown',wake);wake();
addEventListener('resize',resize);
resize();setSpeed(speed);requestAnimationFrame(frame);
</script>

</body></html>
